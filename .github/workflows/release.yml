name: Release Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Publish Windows Installer
    runs-on: windows-latest

    steps:
      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Release tag is empty"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_tag.outputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails v3 CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          $goBin = Join-Path (go env GOPATH) "bin"
          Add-Content -Path $env:GITHUB_PATH -Value $goBin

      - name: Ensure NSIS is installed
        shell: pwsh
        run: |
          $nsis = @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\NSIS\makensis.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) {
            choco install nsis -y --no-progress
          }

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Go tests and vet
        run: |
          go test ./...
          go vet ./...

      - name: Build Windows binary and NSIS installer
        shell: pwsh
        run: .\scripts\build-installer.ps1

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $files = @(
            "bin\JPT Announce-amd64-setup.exe",
            "bin\JPTAnnounce.exe"
          )
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Path $f -Algorithm SHA256).Hash.ToLowerInvariant()
            $name = Split-Path -Path $f -Leaf
            "$hash  $name"
          }
          $lines | Set-Content -Path "bin\SHA256SUMS.txt" -Encoding utf8

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.release_tag.outputs.tag }}"
          $assets = @(
            "bin/JPT Announce-amd64-setup.exe",
            "bin/JPTAnnounce.exe",
            "bin/SHA256SUMS.txt"
          )
          $prevPref = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $prevPref

          if ($exists) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title "JPT Announce $tag" --generate-notes
          }
